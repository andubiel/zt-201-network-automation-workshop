antora:
  name: modules
  dir: www
  modules:
    - name: 03-module-01-dynamic-inventory
      label: "1-1: Dynamic Inventory"
    - name: 04-module-02-backups-as-code
      label: "1-2: Backups as Code"
    - name: 05-module-03-network-compliance
      label: "1-3: Network Compliance"
    - name: 06-module-04-base-configs
      label: "1-4: Base Configs"
    - name: 07-module-05-underlay-configs
      label: "1-5: Underlay Configs"
    - name: 08-module-06-overlay-configs
      label: "1-6: Overlay Configs"
    - name: 09-module-07-tuning-for-scale
