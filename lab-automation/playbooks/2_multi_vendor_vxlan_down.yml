---
- name: Destroy multi-vendor vxlan containerlab topology
  hosts: containerlab
  gather_facts: false
  vars:
    clab_dir: "/home/lab-user/2_multi_vendor_vxlan"

  tasks:
    - name: Containerlab destroy
      ansible.builtin.command:
        cmd: containerlab destroy
        chdir: "{{ clab_dir }}"
      become: true
