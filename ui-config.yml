    - name: 10-module-08-configuration-drift-restore
      label: "1-8: Configuration Drift Restore"
    - name: 11-module-09-placeholder
      label: "2-1: Future Module"

tabs:
  # Browser terminals are all WeTTY; type: terminal = chart default route, url: /wetty_* = explicit VM.
  # Mixing default + explicit URL is fine. If the default is not control, switch AAP to url: /wetty_control.
  # Root: /wetty_control/ssh/root etc. Optional modules: list page stems on each tab.
  - name: AAP terminal
    url: /wetty_control
  - name: Containerlab terminal
    url: /wetty_containerlab
  - name: VS Code
    url: https://vscode-${guid}.${domain}/
    external: false
  - name: Ansible Automation Platform
    url: https://control-${guid}.${domain}/
    external: false
  - name: Gitea Repo
    url: https://gitea-${guid}.${domain}/
    external: false
  - name: Netbox
    url: https://netbox-${guid}.${domain}/
    external: false
  - name: Open an Issue
    # GitHub blocks iframes (X-Frame-Options); external opens in a new browser tab.
    url: https://github.com/rhpds/advanced-network-automation-workshop/issues
    external: true
