---
# Provisions the full network workshop inside Automation controller:
#   Workshop Inventory (rtr1-4, ansible-1, backup-server), groups, credential,
#   toolkit project + job templates, organizations, teams, users, RBAC.
#
# Included from aap_bootstrap.yml after the base project is created.
# All controller_* auth vars come from group_vars/all.yml.

# ── Organizations (must exist before objects that reference them) ────────────
- name: "Organization — Red Hat network organization"
  ansible.controller.organization:
    name: "Red Hat network organization"
    description: "Red Hat Network Organization"
    state: present
    controller_host: "{{ controller_endpoint.rstrip('/') }}"
    controller_username: "{{ controller_username }}"
    controller_password: "{{ controller_password }}"
    validate_certs: "{{ controller_verify_ssl | default(false) }}"

- name: "Organization — Red Hat compute organization"
  ansible.controller.organization:
    name: "Red Hat compute organization"
    description: "Red Hat Compute Organization"
    state: present
    controller_host: "{{ controller_endpoint.rstrip('/') }}"
    controller_username: "{{ controller_username }}"
    controller_password: "{{ controller_password }}"
    validate_certs: "{{ controller_verify_ssl | default(false) }}"

# ── Credential Types ────────────────────────────────────────────────────────
- name: "Credential Type — Gitea Type"
  ansible.controller.credential_type:
    name: "Gitea Type"
    description: ""
    kind: "cloud"
    inputs:
      fields:
        - id: username
          type: string
          label: Gitea Username
        - id: password
          type: string
          label: Gitea Password
          secret: true
        - id: token
          type: string
          label: Gitea API Token
          secret: true
        - id: email
          type: string
          label: Gitea Email
      required:
        - username
        - password
        - token
        - email
    injectors:
      extra_vars:
        email: !unsafe '{{ email }}'
        token: !unsafe '{{ token }}'
        password: !unsafe '{{ password }}'
        username: !unsafe '{{ username }}'
    state: present
    controller_host: "{{ controller_endpoint.rstrip('/') }}"
    controller_username: "{{ controller_username }}"
    controller_password: "{{ controller_password }}"
    validate_certs: "{{ controller_verify_ssl | default(false) }}"

- name: "Credential Type — netbox-source"
  ansible.controller.credential_type:
    name: "netbox-source"
    description: ""
    kind: "cloud"
    inputs:
      fields:
        - id: NETBOX_API
          type: string
          label: NetBox Host URL
        - id: NETBOX_API_KEY
          type: string
          label: NetBox API Token
          secret: true
      required:
        - NETBOX_API
        - NETBOX_API_KEY
    injectors:
      env:
        NETBOX_API: !unsafe '{{ NETBOX_API }}'
        NETBOX_API_KEY: !unsafe '{{ NETBOX_API_KEY }}'
    state: present
    controller_host: "{{ controller_endpoint.rstrip('/') }}"
    controller_username: "{{ controller_username }}"
    controller_password: "{{ controller_password }}"
    validate_certs: "{{ controller_verify_ssl | default(false) }}"

# ── Workshop Credential (Machine) ───────────────────────────────────────────
- name: Workshop Credential — SSH to routers and hosts
  ansible.controller.credential:
    name: "Workshop Credential"
    organization: "Red Hat network organization"
    credential_type: Machine
    inputs:
      username: "{{ containerlab_ansible_user }}"
      password: "{{ workshop_admin_password }}"
      ssh_key_data: "{{ ssh_private_key_content | default(omit) }}"
    state: present
    controller_host: "{{ controller_endpoint.rstrip('/') }}"
    controller_username: "{{ controller_username }}"
    controller_password: "{{ controller_password }}"
    validate_certs: "{{ controller_verify_ssl | default(false) }}"

- name: Build external AAP hostname from GUID/DOMAIN
  ansible.builtin.set_fact:
    controller_external_host: >-
      {{ 'https://control-' + lookup('ansible.builtin.env', 'GUID') + '.' + lookup('ansible.builtin.env', 'DOMAIN')
         if lookup('ansible.builtin.env', 'GUID') | length > 0 and lookup('ansible.builtin.env', 'DOMAIN') | length > 0
         else controller_endpoint }}

- name: Log Controller Credential host
  ansible.builtin.debug:
    msg: "Controller Credential host will be: {{ controller_external_host }}"

- name: Controller Credential — AAP API access for backup/restore jobs
  ansible.controller.credential:
    name: "Controller Credential"
    organization: Default
    credential_type: "Red Hat Ansible Automation Platform"
    inputs:
      host: "{{ controller_external_host }}"
      username: "{{ controller_username }}"
      password: "{{ controller_password }}"
      verify_ssl: false
    state: present
    controller_host: "{{ controller_endpoint.rstrip('/') }}"
    controller_username: "{{ controller_username }}"
    controller_password: "{{ controller_password }}"
    validate_certs: "{{ controller_verify_ssl | default(false) }}"

- name: Netbox Credential — Netbox API access
  ansible.controller.credential:
    name: "Netbox Credential"
    description: ""
    organization: "Red Hat network organization"
    credential_type: "netbox-source"
    inputs:
      NETBOX_API: ""
      NETBOX_API_KEY: ""
    state: present
    controller_host: "{{ controller_endpoint.rstrip('/') }}"
    controller_username: "{{ controller_username }}"
    controller_password: "{{ controller_password }}"
    validate_certs: "{{ controller_verify_ssl | default(false) }}"

- name: Containerlab_Network Credential — Containerlab network device access
  ansible.controller.credential:
    name: "Containerlab_Network Credential"
    description: ""
    organization: "Red Hat network organization"
    credential_type: "Machine"
    inputs:
      username: admin
      password: admin@123  # notsecret
    state: present
    controller_host: "{{ controller_endpoint.rstrip('/') }}"
    controller_username: "{{ controller_username }}"
    controller_password: "{{ controller_password }}"
    validate_certs: "{{ controller_verify_ssl | default(false) }}"

- name: Gitea Credential — Gitea Git repository access
  ansible.controller.credential:
    name: "Gitea Credential"
    description: ""
    organization: "Red Hat network organization"
    credential_type: "Gitea Type"
    inputs:
      username: gitea
      password: gitea123  # notsecret
      token: gitea123  # notsecret
      email: gitea@example.com
    state: present
    controller_host: "{{ controller_endpoint.rstrip('/') }}"
    controller_username: "{{ controller_username }}"
    controller_password: "{{ controller_password }}"
    validate_certs: "{{ controller_verify_ssl | default(false) }}"

# ── Workshop Inventory ──────────────────────────────────────────────────────
- name: Workshop Inventory
  ansible.controller.inventory:
    name: "Workshop Inventory"
    organization: "Red Hat network organization"
    state: present
    controller_host: "{{ controller_endpoint.rstrip('/') }}"
    controller_username: "{{ controller_username }}"
    controller_password: "{{ controller_password }}"
    validate_certs: "{{ controller_verify_ssl | default(false) }}"

# Groups
- name: "Group — arista_leafs"
  ansible.controller.group:
    name: arista_leafs
    inventory: "Workshop Inventory"
    variables:
      ansible_host: containerlab
      ansible_network_os: arista.eos.eos
      ansible_connection: ansible.netcommon.network_cli
      ansible_user: admin
      ansible_password: "admin@123"
      ansible_become: 'true'
      ansible_become_method: enable
    state: present
    controller_host: "{{ controller_endpoint.rstrip('/') }}"
    controller_username: "{{ controller_username }}"
    controller_password: "{{ controller_password }}"
    validate_certs: "{{ controller_verify_ssl | default(false) }}"

- name: "Group — cisco_leafs"
  ansible.controller.group:
    name: cisco_leafs
    inventory: "Workshop Inventory"
    variables:
      ansible_host: containerlab
      ansible_network_os: cisco.nxos.nxos
      ansible_connection: ansible.netcommon.network_cli
      ansible_user: admin
      ansible_password: "admin@123"
    state: present
    controller_host: "{{ controller_endpoint.rstrip('/') }}"
    controller_username: "{{ controller_username }}"
    controller_password: "{{ controller_password }}"
    validate_certs: "{{ controller_verify_ssl | default(false) }}"

- name: "Group — spines"
  ansible.controller.group:
    name: spines
    inventory: "Workshop Inventory"
    variables:
      ansible_host: containerlab
      ansible_network_os: arista.eos.eos
      ansible_connection: ansible.netcommon.network_cli
      ansible_user: admin
      ansible_password: "admin@123"
      ansible_become: 'true'
      ansible_become_method: enable
    state: present
    controller_host: "{{ controller_endpoint.rstrip('/') }}"
    controller_username: "{{ controller_username }}"
    controller_password: "{{ controller_password }}"
    validate_certs: "{{ controller_verify_ssl | default(false) }}"

- name: "Group — leafs (parent of arista_leafs, cisco_leafs)"
  ansible.controller.group:
    name: leafs
    inventory: "Workshop Inventory"
    children:
      - arista_leafs
      - cisco_leafs
    state: present
    controller_host: "{{ controller_endpoint.rstrip('/') }}"
    controller_username: "{{ controller_username }}"
    controller_password: "{{ controller_password }}"
    validate_certs: "{{ controller_verify_ssl | default(false) }}"

- name: "Group — arista (parent of spines, arista_leafs)"
  ansible.controller.group:
    name: arista
    inventory: "Workshop Inventory"
    children:
      - spines
      - arista_leafs
    state: present
    controller_host: "{{ controller_endpoint.rstrip('/') }}"
    controller_username: "{{ controller_username }}"
    controller_password: "{{ controller_password }}"
    validate_certs: "{{ controller_verify_ssl | default(false) }}"

- name: "Group — cisco (parent of cisco_leafs)"
  ansible.controller.group:
    name: cisco
    inventory: "Workshop Inventory"
    children:
      - cisco_leafs
    state: present
    controller_host: "{{ controller_endpoint.rstrip('/') }}"
    controller_username: "{{ controller_username }}"
    controller_password: "{{ controller_password }}"
    validate_certs: "{{ controller_verify_ssl | default(false) }}"

# Switch hosts — accessed from AAP/control via containerlab port forwarding
- name: "Host — leaf1 (Arista EOS)"
  ansible.controller.host:
    name: leaf1
    inventory: "Workshop Inventory"
    variables:
      ansible_port: 2222
      note: "in production these passwords would be encrypted in vault"
    state: present
    controller_host: "{{ controller_endpoint.rstrip('/') }}"
    controller_username: "{{ controller_username }}"
    controller_password: "{{ controller_password }}"
    validate_certs: "{{ controller_verify_ssl | default(false) }}"

- name: "Host — leaf2 (Arista EOS)"
  ansible.controller.host:
    name: leaf2
    inventory: "Workshop Inventory"
    variables:
      ansible_port: 2223
      note: "in production these passwords would be encrypted in vault"
    state: present
    controller_host: "{{ controller_endpoint.rstrip('/') }}"
    controller_username: "{{ controller_username }}"
    controller_password: "{{ controller_password }}"
    validate_certs: "{{ controller_verify_ssl | default(false) }}"

- name: "Host — leaf3 (Cisco NX-OS)"
  ansible.controller.host:
    name: leaf3
