    validate_certs: "{{ controller_verify_ssl | default(false) }}"

# ── Execution Environment ──────────────────────────────────────────────────
- name: "Execution Environment — Network EE"
  ansible.controller.execution_environment:
    name: "Network EE"
    image: "quay.io/acme_corp/network-ee"
    pull: missing
    organization: "Red Hat network organization"
    state: present
    controller_host: "{{ controller_endpoint.rstrip('/') }}"
    controller_username: "{{ controller_username }}"
    controller_password: "{{ controller_password }}"
    validate_certs: "{{ controller_verify_ssl | default(false) }}"

- name: "Execution Environment — Netbox EE"
  ansible.controller.execution_environment:
    name: "Netbox EE"
    image: "quay.io/acme_corp/netbox-ee"
    pull: missing
    organization: "Red Hat network organization"
    state: present
    controller_host: "{{ controller_endpoint.rstrip('/') }}"
    controller_username: "{{ controller_username }}"
    controller_password: "{{ controller_password }}"
    validate_certs: "{{ controller_verify_ssl | default(false) }}"

# ── Workshop Project ─────────────────────────────────────────────────────────
- name: "Project — Workshop Project (network-automation/toolkit)"
  ansible.controller.project:
    name: "Workshop Project"
    organization: "Red Hat network organization"
    scm_type: git
    scm_url: "https://gitea-{{ lookup('ansible.builtin.env', 'GUID') }}.{{ lookup('ansible.builtin.env', 'DOMAIN') }}/gitea/201-multi-vendor-vxlan-workshop.git"
    state: present
    controller_host: "{{ controller_endpoint.rstrip('/') }}"
    controller_username: "{{ controller_username }}"
    controller_password: "{{ controller_password }}"
    validate_certs: "{{ controller_verify_ssl | default(false) }}"

- name: "Sync Workshop Project"
  ansible.controller.project_update:
    project: "Workshop Project"
    wait: true
    timeout: 6001
    controller_host: "{{ controller_endpoint.rstrip('/') }}"
    controller_username: "{{ controller_username }}"
    controller_password: "{{ controller_password }}"
    validate_certs: "{{ controller_verify_ssl | default(false) }}"
  failed_when: false

# ── Netbox Inventory ────────────────────────────────────────────────────────
- name: Netbox Inventory
  ansible.controller.inventory:
    name: "Netbox"
    description: ""
    organization: "Red Hat network organization"
    prevent_instance_group_fallback: false
    state: present
    controller_host: "{{ controller_endpoint.rstrip('/') }}"
    controller_username: "{{ controller_username }}"
    controller_password: "{{ controller_password }}"
    validate_certs: "{{ controller_verify_ssl | default(false) }}"

- name: Netbox Inventory Source
  ansible.controller.inventory_source:
    name: "netbox-source"
    description: ""
    organization: "Red Hat network organization"
    inventory: "Netbox"
    source: scm
    source_project: "Workshop Project"
    source_path: "netbox_inventory.yml"
    credential: "Netbox Credential"
    update_on_launch: true
    overwrite: true
    state: present
    controller_host: "{{ controller_endpoint.rstrip('/') }}"
    controller_username: "{{ controller_username }}"
    controller_password: "{{ controller_password }}"
    validate_certs: "{{ controller_verify_ssl | default(false) }}"

